spring.application.name=roupa

# ─────────────────────────────────────────────
# CONEXÃO COM O BANCO DE DADOS
# ─────────────────────────────────────────────

# "jdbc" = protocolo de conexão Java com banco
# "postgresql" = qual banco estamos usando
# "localhost" = o banco está na nossa própria máquina
# "5432" = porta padrão do PostgreSQL
# "bookstore_db" = nome do banco que você criou
spring.datasource.url=jdbc:postgresql://localhost:5432/artificium_db

# Usuário e senha do PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=17011998

# Driver JDBC — a "ponte" entre Java e PostgreSQL
# Spring consegue detectar automaticamente, mas é boa prática declarar
spring.datasource.driver-class-name=org.postgresql.Driver

# ─────────────────────────────────────────────
# JPA / HIBERNATE (o ORM que converte Java ↔ SQL)
# ─────────────────────────────────────────────

# "update" = JPA lê as classes Java e atualiza as tabelas no banco
# automaticamente — ideal para desenvolvimento
# Em produção, NUNCA use "update". Use "validate" ou migrations (Flyway)
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL gerado pelo JPA no console — ótimo para aprender
# e entender o que está acontecendo nos bastidores
spring.jpa.show-sql=true

# Formata o SQL no console — mais fácil de ler
spring.jpa.properties.hibernate.format_sql=true

# Diz ao Hibernate que estamos usando PostgreSQL
# para que ele gere SQL compatível
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect